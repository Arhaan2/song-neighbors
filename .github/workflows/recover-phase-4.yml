# Re-deliver the already tested Phase 4 tar, with a fresh workflow commit as
# the Pages delivery ID. The site's build-info.json still identifies its source.
name: Recover verified Phase 4 Pages artifact
on: workflow_dispatch

permissions: {}

jobs:
  restore:
    name: Verify original release payload
    if: github.repository == 'Arhaan2/song-neighbors' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      SOURCE: f8c6260985bbb4de1a041e42e2b1959522aa88b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject changed product or catalog inputs
        run: |
          git merge-base --is-ancestor "$SOURCE" "$GITHUB_SHA"
          git diff --exit-code "$SOURCE" "$GITHUB_SHA" -- . \
            ':(exclude).github/workflows/ci.yml' ':(exclude).github/workflows/recover-phase-4.yml' \
            ':(exclude)PROGRESS.md' ':(exclude)docs/phases/**'
      - name: Retrieve the artifact tested on integrated main
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: '41923813385'
          artifact-ids: '13368122615'
          path: recovered
          merge-multiple: true
      - name: Verify exact tar bytes and embedded release identity
        run: |
          echo '7e5919b8ce212548440ec3fa1247e099e7cee3ac8f782ef5199faa8584341e05  recovered/artifact.tar' | sha256sum --check --strict
          tar -xOf recovered/artifact.tar ./build-info.json | jq -e --arg sha "$SOURCE" \
            '.sourceSha == $sha and .sourceDirty == false and .catalogVersion == "fma-small-clap-general-20261104" and .catalogManifestSha256 == "b57bda0fb968b5feb49bb4ad7f33ea61ff67647483f496b519edea85b576ae11" and .basePath == "/song-neighbors/"'
      - name: Pass the same tar to the Pages deploy action
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: recovered/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy original verified payload
    needs: restore
    if: github.repository == 'Arhaan2/song-neighbors' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
