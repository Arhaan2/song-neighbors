[project]
name = "song-neighbors-catalog"
version = "0.0.0"
description = "Offline catalog tooling for Song Neighbors; Phase 0 foundation only"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
